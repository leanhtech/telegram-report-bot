# Mẫu cấu hình. Copy thành config.yaml rồi điền giá trị thật.
#   Windows:  copy config.example.yaml config.yaml
#   Linux/Mac: cp config.example.yaml config.yaml
# config.yaml và credentials.json KHÔNG được commit (đã có trong .gitignore).

telegram:
  bot_token: "PUT-YOUR-BOT-TOKEN-HERE"      # lấy từ @BotFather
  admin_ids:
  - 123456789                                # user_id được phép dùng /cauhinh (@userinfobot)

google_sheets:
  spreadsheet_id: "PUT-YOUR-SPREADSHEET-ID-HERE"   # đoạn giữa /d/ và /edit trên URL sheet
  worksheet_name: Task Đã Điều Phối
  credentials_file: credentials.json         # key service account (tự tạo, không commit)

timezone: Asia/Ho_Chi_Minh

# LƯU Ý ngày trong tuần: python-telegram-bot >= 20 dùng 0=Chủ Nhật ... 6=Thứ Bảy.
# => [1, 2, 3, 4, 5] = Thứ Hai -> Thứ Sáu; [5] = Thứ Sáu.
schedules:
  team_report:
    enabled: true
    time: '16:20'
    days: [1, 2, 3, 4, 5]
    chat_id: -1000000000000                  # chat_id nhóm (dùng /chatid để lấy)
    topic_id: 0                              # topic_id nếu nhóm có topic
    kiosk_chat_id: -1000000000000            # (tùy chọn) gửi riêng báo cáo Kiosk
    kiosk_topic_id: 0
  personal_report:
    enabled: true
    time: '16:00'
    days: [1, 2, 3, 4, 5]
    chat_id: 123456789                        # gửi về chat riêng của quản lý
  deadline_alert:
    enabled: true
    time: '13:28'
    days: [1, 2, 3, 4, 5]
    chat_id: 123456789
  weekly_summary:
    enabled: true
    time: '16:25'
    days: [5]                                # Thứ Sáu
    chat_id: -1000000000000
    topic_id: 0

report:
  kiosk_project_name: Kiosk
  kiosk_report_title: Báo cáo nội dung thực hiện OS Kiosk
  other_report_title: Báo cáo nội dung thực hiện các dự án
  strip_bracket_prefixes: true
  cache_seconds: 120
  daily_capacity_hours: 8                     # mức chuẩn giờ/người/ngày cho /tai

team:
  # Fallback cho /tai khi không đọc được dropdown cột 'Nhân Sự Thực Hiện'.
  # Điền qua Telegram: /cauhinh set team.members Tên A, Tên B, Tên C
  members: []

# ------------------------------------------------------------------
# Theo dõi thay đổi trên các file sheet KẾ HOẠCH (khác sheet báo cáo ở trên).
# Thêm/bớt nguồn ngay trên Telegram bằng lệnh /nguon — không cần sửa file này.
# ------------------------------------------------------------------
watch:
  enabled: false                    # bật bằng /theodoi bat
  poll_interval_minutes: 10
  # LƯU Ý: cùng quy ước với schedules ở trên — 0=Chủ Nhật ... 6=Thứ Bảy.
  # => [1, 2, 3, 4, 5] = Thứ Hai -> Thứ Sáu.
  active_days: [1, 2, 3, 4, 5]
  active_hours: '08:00-18:00'       # ngoài khung giờ không quét
  digest_times: ['08:30', '16:30']  # giờ gửi bản tin gom
  max_instant_items: 15             # quá ngưỡng thì gửi tin tóm tắt
  state_file: state/watch_state.json
  instant_kinds: [added, removed]   # loại thay đổi báo ngay
  instant_fields: [due, assignee]   # trường đổi thì báo ngay
  sources: []                       # do /nguon them điền vào
  targets:
    - chat_id: 123456789            # chat riêng: nhận đủ
      send: [instant, digest]
    - chat_id: -1000000000000       # nhóm team: chỉ bản tin
      topic_id: 0
      send: [digest]
  filters:                          # trống = không lọc
    sources: []
    projects: []                    # chỉ có tác dụng ở chế độ task
    assignees: []                   # chỉ có tác dụng ở chế độ task
    keywords: []                    # khớp mọi ô — dùng được cho chế độ generic
